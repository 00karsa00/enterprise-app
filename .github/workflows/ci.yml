name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create test env
        run: |
          echo "VITE_APP_NAME=Test App" >> .env.test
          echo "VITE_API_BASE_URL=http://localhost:3000/api" >> .env.test
          echo "VITE_AUTH_PROVIDER=jwt" >> .env.test
          echo "VITE_NOTIFICATION_PROVIDER=sonner" >> .env.test
          echo "VITE_LOG_PROVIDER=console" >> .env.test
          echo "VITE_ANALYTICS_PROVIDER=none" >> .env.test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_APP_NAME: Enterprise App
          VITE_API_BASE_URL: https://api.example.com/api
          VITE_AUTH_PROVIDER: jwt
          VITE_NOTIFICATION_PROVIDER: sonner
          VITE_LOG_PROVIDER: console
          VITE_ANALYTICS_PROVIDER: none

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
